services:
  proxy:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
  db:
    ports:
      - "5432:5432"
  adminer:
    ports:
      - "8080:8080"
  backend:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Use uvicorn directly without reload - Docker handles reloading via develop.watch
    # Single worker prevents race conditions in development
    # Note: For production, increase workers (e.g., --workers 4)
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
            - __pycache__
            - .pytest_cache
            - .ruff_cache
            - htmlcov
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./frontend
          action: rebuild
          ignore:
            - ./frontend/node_modules
            - ./frontend/dist
    # Volumes for development - mount backend directories but NOT frontend
    # Frontend is built in Docker and should not be synced from host
    volumes:
      - ./backend/app/api:/app/backend/app/api
      - ./backend/app/core:/app/backend/app/core
      - ./backend/app/infrastructure:/app/backend/app/infrastructure
      - ./backend/app/services:/app/backend/app/services
      - ./backend/app/crud.py:/app/backend/app/crud.py
      - ./backend/app/models.py:/app/backend/app/models.py
      - ./backend/app/utils.py:/app/backend/app/utils.py
      - ./backend/app/initial_data.py:/app/backend/app/initial_data.py
      - ./backend/app/__init__.py:/app/backend/app/__init__.py
      - ./backend/app/main.py:/app/backend/app/main.py
      - ./backend/tests:/app/backend/tests
      - ./backend/scripts:/app/backend/scripts
      - ./backend/pyproject.toml:/app/backend/pyproject.toml
      - ./backend/alembic.ini:/app/backend/alembic.ini
      - ./backend/alembic:/app/backend/alembic
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      FASTAPI_ENV: "development"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

